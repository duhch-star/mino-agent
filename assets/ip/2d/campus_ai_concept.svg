<rect width="1200" height="820" fill="#f3f2ed"/>
<text x="52" y="62" class="title">校园 AI 小助手 / 概念 B</text>
<text x="52" y="93" class="sub">设计对比稿 · 非官方校徽 / 校色 · 暂名「小北」</text>
<rect x="40" y="124" width="470" height="630" rx="26" fill="#e5ece7"/>
<text x="70" y="165" class="label">01 / 全身角色</text>
<text x="70" y="191" class="sub">短身体 · 软方脸 · 小手脚 · 校园制服领</text>
<use href="#character" transform="translate(58 216) scale(1.38)"/>
<text x="70" y="709" class="sub">暖白 × 灰青绿 × 杏黄，避免大面积机械黑脸。</text>
<rect x="534" y="124" width="626" height="286" rx="26" fill="#fffdf8"/>
<text x="564" y="165" class="label">02 / 头像使用效果</text>
<use href="#head" transform="translate(568 180) scale(.95)"/>
<text x="880" y="228" class="label">不是标准圆脸</text>
<text x="880" y="260" class="sub">短额头 / 软方下颌</text>
<text x="880" y="288" class="sub">五官集中 / 下巴留白少</text>
<text x="880" y="316" class="sub">可独立用于语音通话</text>
<rect x="534" y="434" width="626" height="320" rx="26" fill="#fffdf8"/>
<text x="564" y="476" class="label">03 / 表情扩展</text>
<g transform="translate(543 501) scale(.65)"><use href="#head"/></g>
<g transform="translate(745 501) scale(.65)"><use href="#face-shell"/><path d="M107 106 Q116 93 125 106 M177 106 Q186 93 195 106" stroke="#304259" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M137 114 Q150 138 166 114 Z" fill="#304259"/></g>
<g transform="translate(944 501) scale(.65)"><use href="#face-shell"/><path d="M107 105 L123 99 M177 99 L193 105 M142 119 Q153 114 161 120" stroke="#304259" stroke-width="4" fill="none" stroke-linecap="round"/></g>
<text x="627" y="648" text-anchor="middle" class="sub">倾听 / 微笑</text><text x="829" y="648" text-anchor="middle" class="sub">欢迎 / 开心</text><text x="1027" y="648" text-anchor="middle" class="sub">思考 / 回答</text>
<text x="564" y="707" class="sub">保留完整角色，也能只展示头部；脸、嘴、手臂可分层制作动画。</text>
<text x="52" y="792" class="sub">方向重点：更像亲切的校园同学，而不是硬壳机器人或标准圆形表情球。</text>
</svg>